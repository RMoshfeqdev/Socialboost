<div
    id="notification"
    class="notification"
    role="alert"
></div>


<script>

function getCurrentUser() {

    try {

        const raw =
            localStorage.getItem(
                "socialboost_user"
            );

        if (!raw) {
            return null;
        }

        return JSON.parse(raw);

    } catch (error) {

        return null;

    }

}


function showOrdersNotification(message) {

    const notification =
        document.getElementById(
            "notification"
        );

    if (!notification) {
        return;
    }

    notification.textContent =
        message;

    notification.classList.add(
        "show"
    );

    setTimeout(() => {

        notification.classList.remove(
            "show"
        );

    }, 3000);

}


function goHome() {

    window.location.href = "/";

}


function logoutFromOrders() {

    localStorage.removeItem(
        "socialboost_user"
    );

    window.location.href = "/";

}


function formatPrice(price) {

    const number =
        Number(price) || 0;

    return number
        .toLocaleString("fa-IR") +
        " تومان";

}


function formatDate(date) {

    if (!date) {
        return "-";
    }

    try {

        const d =
            new Date(date);

        if (Number.isNaN(
            d.getTime()
        )) {

            return date;

        }

        return d.toLocaleString(
            "fa-IR"
        );

    } catch (error) {

        return date;

    }

}


function translateService(service) {

    const map = {

        followers: "فالوور",

        likes: "لایک",

        views: "بازدید",

        engagement: "تعامل"

    };

    return (
        map[service] ||
        service ||
        "-"
    );

}


function translatePlatform(platform) {

    const map = {

        instagram: "Instagram",

        tiktok: "TikTok",

        youtube: "YouTube"

    };

    return (
        map[platform] ||
        platform ||
        "-"
    );

}


function translateStatus(status) {

    const map = {

        pending: "در انتظار",

        processing: "در حال پردازش",

        completed: "تکمیل شده",

        cancelled: "لغو شده",

        failed: "ناموفق"

    };

    return (
        map[status] ||
        status ||
        "-"
    );

}


function getStatusClass(status) {

    const allowed = [

        "pending",
        "processing",
        "completed",
        "cancelled",
        "failed"

    ];

    return allowed.includes(status)
        ? status
        : "pending";

}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function loadOrders() {

    const user =
        getCurrentUser();

    if (!user) {

        window.location.href =
            "/";

        return;

    }


    const loading =
        document.getElementById(
            "ordersLoading"
        );

    const empty =
        document.getElementById(
            "ordersEmpty"
        );

    const errorBox =
        document.getElementById(
            "ordersError"
        );

    const table =
        document.getElementById(
            "ordersTableWrapper"
        );

    const body =
        document.getElementById(
            "ordersBody"
        );

    const refresh =
        document.getElementById(
            "refreshOrders"
        );


    loading.style.display =
        "block";

    empty.style.display =
        "none";

    errorBox.style.display =
        "none";

    table.style.display =
        "none";

    refresh.disabled =
        true;


    document.getElementById(
        "userInfo"
    ).textContent =
        "ایمیل: " +
        (user.email || "-");


    try {

        const response =
            await fetch(
                "/api/orders"
            );


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت سفارش‌ها."
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "دریافت سفارش‌ها ناموفق بود."
            );

        }


        const orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        /*
         * اگر API فعلاً همه سفارش‌ها را برگرداند،
         * سمت مرورگر فقط سفارش‌های کاربر فعلی نمایش داده می‌شود.
         */
        const userOrders =
            orders.filter(order => {

                /*
                 * نسخه فعلی API شما در خروجی
                 * user_id را برنمی‌گرداند.
                 *
                 * بنابراین فعلاً سفارش‌ها نمایش داده می‌شوند.
                 * در مرحله بعد API را user-specific می‌کنیم.
                 */

                return true;

            });


        loading.style.display =
            "none";


        if (!userOrders.length) {

            empty.style.display =
                "block";

            return;

        }


        body.innerHTML =
            userOrders
                .map(order => {

                    const status =
                        String(
                            order.status ||
                            "pending"
                        )
                        .toLowerCase();


                    return `
                        <tr>

                            <td class="order-id">
                                #${escapeHtml(order.id)}
                            </td>

                            <td>
                                ${escapeHtml(
                                    translateService(
                                        order.service
                                    )
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    translatePlatform(
                                        order.platform
                                    )
                                )}
                            </td>

                            <td>

                                <a
                                    class="order-link"
                                    href="${escapeHtml(order.link)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    title="${escapeHtml(order.link)}"
                                >
                                    ${escapeHtml(order.link)}
                                </a>

                            </td>

                            <td>
                                ${Number(
                                    order.quantity || 0
                                ).toLocaleString("fa-IR")}
                            </td>

                            <td>
                                ${escapeHtml(
                                    formatPrice(
                                        order.price
                                    )
                                )}
                            </td>

                            <td>

                                <span
                                    class="status ${getStatusClass(status)}"
                                >
                                    ${escapeHtml(
                                        translateStatus(
                                            status
                                        )
                                    )}
                                </span>

                            </td>

                            <td>
                                ${escapeHtml(
                                    formatDate(
                                        order.created_at
                                    )
                                )}
                            </td>

                        </tr>
                    `;

                })
                .join("");


        table.style.display =
            "block";


    } catch (err) {

        console.error(
            err
        );

        loading.style.display =
            "none";

        errorBox.style.display =
            "block";

        showOrdersNotification(
            err.message ||
            "خطا در دریافت سفارش‌ها."
        );


    } finally {

        refresh.disabled =
            false;

    }

}

        const user =
